services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: inventory_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d inventory_db"]
      interval: 5s
      timeout: 5s
      retries: 10
  server:
    build:
      context: ./server
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/inventory_db?schema=public
      PORT: 3001
      JWT_SECRET: supersecret_inventory_jwt_key
    ports:
      - "3001:3001"
  client:
    build:
      context: ./client
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:3001
    restart: unless-stopped
    depends_on:
      server:
        condition: service_started
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:3001
      PORT: 3000
    ports:
      - "3000:3000"

volumes:
  postgres_data:
