services:
  - type: web
    name: inventory-api
    env: node
    plan: free
    rootDir: server
    buildCommand: |
      npm install
      npx prisma generate
      npx prisma migrate deploy
      npm run build
    startCommand: npm run start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: inventory-db
          property: connectionString

  - type: web
    name: inventory-web
    env: node
    plan: free
    rootDir: client
    buildCommand: |
      npm install
      npm run build
    startCommand: npm run start
    envVars:
      - key: NEXT_PUBLIC_API_BASE_URL
        value: https://inventory-api-v9ur.onrender.com

databases:
  - name: inventory-db
    plan: free
